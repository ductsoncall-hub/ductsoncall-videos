name: Update video archive

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest uploads from the YouTube RSS feed
        run: python scripts/update_from_rss.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "Archive already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Update video archive ($(date -u +%Y-%m-%d))"
          git push
